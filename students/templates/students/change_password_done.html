<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Changed</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #020617;
            color: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: #0f172a;
            padding: 40px;
            border-radius: 20px;
            width: 420px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }

        .success-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h2 {
            color: #22c55e;
            margin-bottom: 10px;
        }

        p {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 10px;
            background: #38bdf8;
            color: #020617;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn:hover {
            background: #0ea5e9;
        }
    </style>
</head>

<body>

<div class="card">
    <div class="success-icon">✅</div>

    <h2>Password Changed Successfully!</h2>
    <p>Your password has been updated. You can now continue using your account securely.</p>

    <a href="/" class="btn">Go to Dashboard</a>
</div>

</body>
</html>
