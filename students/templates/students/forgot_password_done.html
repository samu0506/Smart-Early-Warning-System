<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Verified</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #020617;
            color: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: #0f172a;
            padding: 40px;
            border-radius: 20px;
            width: 450px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h2 {
            color: #38bdf8;
            margin-bottom: 10px;
        }

        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            border-radius: 10px;
            background: #22c55e;
            color: #020617;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn:hover {
            background: #16a34a;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            font-size: 13px;
            color: #94a3b8;
            text-decoration: none;
        }

        .back-link:hover {
            color: #38bdf8;
        }

        .student-info {
            margin-top: 15px;
            background: #1e293b;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #cbd5e1;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">✅</div>

    <h2>Student Verified</h2>

    <p>
        Your Roll Number has been verified successfully.
        <br><br>
        You can now reset your password securely.
    </p>

    {% if roll_no %}
    <div class="student-info">
        Verified Roll Number: <strong>{{ roll_no }}</strong>
    </div>
    {% endif %}

    <br>

    <!-- FIXED WITH NAMESPACE -->
    <a href="{% url 'students:simple_reset_password' %}" class="btn">
        Reset Password
    </a>

    <a href="{% url 'students:student_login' %}" class="back-link">
        ← Back to Login
    </a>

</div>

</body>
</html>
