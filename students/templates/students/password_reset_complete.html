<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Reset Complete</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #020617;
            color: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: #0f172a;
            padding: 40px;
            border-radius: 20px;
            width: 450px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }

        .icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h2 {
            color: #22c55e;
            margin-bottom: 10px;
        }

        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 10px;
            background: #38bdf8;
            color: #020617;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn:hover {
            background: #0ea5e9;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">🎉</div>

    <h2>Password Reset Successful!</h2>

    <p>
        Your password has been set successfully.
        <br><br>
        You can now log in with your new password.
    </p>

    <a href="/" class="btn">Go to Login</a>

</div>

</body>
</html>
