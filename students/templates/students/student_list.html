<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>
</head>
<body>

<h2>Student List</h2>

<table border="1">
    <tr>
        <th>Student ID</th>
        <th>Full Name</th>
        <th>Attendance (%)</th>
        <th>Average Marks</th>
        <th>Risk Level</th>
    </tr>

    {% for student in students %}
    <tr>
        <td>{{ student.student_id }}</td>
        <td>{{ student.full_name }}</td>
        <td>{{ student.attendance_percentage }}</td>
        <td>{{ student.average_marks }}</td>
        <td>{{ student.risk_level }}</td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
